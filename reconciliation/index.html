<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA项目 - Applovin Max收入数据处理工具</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        /* 顶部返回导航按钮样式（与广告配置页面完全一致） */
        .nav-header { position: absolute; top: 20px; left: 20px; }
        .back-link { text-decoration: none; color: #0066cc; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .back-link:hover { text-decoration: underline; }

        .card { background: white; border-radius: 16px; padding: 36px; width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
        p { color: #86868b; font-size: 14px; margin-bottom: 24px; }
        .drop-zone { border: 2px dashed #0066cc; border-radius: 12px; padding: 32px 16px; background: #f0f7ff; cursor: pointer; transition: 0.2s; }
        .drop-zone:hover, .drop-zone.over { background: #e1f0ff; border-color: #004499; }
        .file-list { text-align: left; margin-top: 20px; font-size: 13px; color: #333; }
        .file-item { display: flex; justify-content: space-between; margin-bottom: 6px; padding: 6px 10px; background: #f8f9fa; border-radius: 6px; }
        .status-ok { color: #28a745; font-weight: bold; }
        .btn { background: #0066cc; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; width: 100%; margin-top: 20px; cursor: pointer; font-weight: 500; display: none; }
        .btn:hover { background: #004499; }
        #error-msg { margin-top: 15px; color: #dc3545; font-size: 13px; text-align: left; white-space: pre-wrap; display: none; background: #fdf2f2; padding: 10px; border-radius: 6px; border: 1px solid #fecdca; }
    </style>
</head>
<body>

<!-- 左上角返回控制台主页按钮 -->
<div class="nav-header">
    <a href="/" class="back-link">&larr; 返回控制台主页</a>
</div>

<div class="card">
    <h2>MAX每月对账表格处理</h2>
    <p>拖入或一次性选择 <b>max.csv</b>, <b>tgaado.csv</b>, <b>find.xlsx</b></p>
    
    <div class="drop-zone" id="dropZone">
        将 3 个文件拖到此处，或点击上传
        <input type="file" id="fileInput" multiple accept=".csv, .xlsx" style="display: none;">
    </div>

    <div class="file-list" id="fileList"></div>
    <div id="error-msg"></div>
    <button class="btn" id="processBtn">处理并下载 Excel</button>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const processBtn = document.getElementById('processBtn');
    const errorMsg = document.getElementById('error-msg');
    let filesMap = {};

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('over');
    dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('over'); handleFiles(e.dataTransfer.files); };

    function handleFiles(files) {
        for (let file of files) {
            let name = file.name.toLowerCase();
            if (name.includes('max')) filesMap['max'] = file;
            else if (name.includes('tgaado')) filesMap['tgaado'] = file;
            else if (name.includes('find')) filesMap['find'] = file;
        }
        renderFileList();
    }

    function renderFileList() {
        let html = '';
        const targets = [{key:'max', label:'max.csv'}, {key:'tgaado', label:'tgaado.csv'}, {key:'find', label:'find.xlsx'}];
        let readyCount = 0;
        
        targets.forEach(t => {
            if (filesMap[t.key]) {
                html += `<div class="file-item"><span>${t.label}</span><span class="status-ok">✔ 已就绪</span></div>`;
                readyCount++;
            }
        });
        fileList.innerHTML = html;
        if (readyCount === 3) processBtn.style.display = 'block';
    }

    processBtn.onclick = async () => {
        errorMsg.style.display = 'none';
        errorMsg.innerText = '';

        const readAsArrayBuffer = file => new Promise(res => {
            const r = new FileReader();
            r.onload = e => res(e.target.result);
            r.readAsArrayBuffer(file);
        });

        // 解析源数据
        const wb1 = XLSX.read(await readAsArrayBuffer(filesMap['max']), {type: 'array'});
        const wb2 = XLSX.read(await readAsArrayBuffer(filesMap['tgaado']), {type: 'array'});
        const wb3 = XLSX.read(await readAsArrayBuffer(filesMap['find']), {type: 'array'});

        let data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {header: 1});
        let data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {header: 1});
        let data3 = XLSX.utils.sheet_to_json(wb3.Sheets[wb3.SheetNames[0]], {header: 1});

        // 查找表构建 Lookup Map
        let mapE1 = {}, mapG1 = {}, mapH1 = {};
        let mapE2 = {}, mapG2 = {}, mapH2 = {};

        data3.forEach(row => {
            if (!row) return;
            // Sheet1 Match: D->I(Index 8), E->J(Index 9) | F->L(Index 11), G->M(Index 12), H->N(Index 13)
            if (row[8]) mapE1[row[8]] = row[9];
            if (row[11]) { mapG1[row[11]] = row[12]; mapH1[row[11]] = row[13]; }

            // Sheet2 Match: D->A(Index 0), E->B(Index 1) | F->D(Index 3), G->E(Index 4), H->F(Index 5)
            if (row[0]) mapE2[row[0]] = row[1];
            if (row[3]) { mapG2[row[3]] = row[4]; mapH2[row[3]] = row[5]; }
        });

        let missingList = [];

        function processRows(rows, isSheet1, sheetName) {
            if (!rows || rows.length === 0) return rows;
            // 表头处理
            let header = rows[0];
            header.splice(4, 0, "游戏原名");
            header.splice(6, 0, "渠道", "收款账户");

            for (let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if (!r || r.length === 0) continue;
                
                let keyD = r[3]; // D列值
                let valE = isSheet1 ? mapE1[keyD] : mapE2[keyD];

                let keyF = r[4]; // 插列前的 F 列原始值变更为 index 4
                let valG = isSheet1 ? mapG1[keyF] : mapG2[keyF];
                let valH = isSheet1 ? mapH1[keyF] : mapH2[keyF];

                // 记录缺失
                if (!valE) missingList.push(`【${sheetName}】第 ${i+1} 行 E列(游戏原名)`);
                if (!valG) missingList.push(`【${sheetName}】第 ${i+1} 行 G列(渠道)`);
                if (!valH) missingList.push(`【${sheetName}】第 ${i+1} 行 H列(收款账户)`);

                // 插列填充
                r.splice(4, 0, valE || "");
                r.splice(6, 0, valG || "", valH || "");
            }
            return rows;
        }

        let processedData1 = processRows(data1, true, "MAX-YOURMAX账号");
        let processedData2 = processRows(data2, false, "MAX-Togaado账号");

        // 转换为新 Sheet
        const newWs1 = XLSX.utils.aoa_to_sheet(processedData1);
        const newWs2 = XLSX.utils.aoa_to_sheet(processedData2);

        // 设置表头 E1, G1, H1 黄色高亮样式（注意：标准应用打开支持）
        ["E1", "G1", "H1"].forEach(cell => {
            if (newWs1[cell]) newWs1[cell].s = { fill: { fgColor: { rgb: "FFFF00" } } };
            if (newWs2[cell]) newWs2[cell].s = { fill: { fgColor: { rgb: "FFFF00" } } };
        });

        // 组装新工作簿
        const newWb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWb, newWs1, "MAX-YOURMAX账号");
        XLSX.utils.book_append_sheet(newWb, newWs2, "MAX-Togaado账号");
        XLSX.utils.book_append_sheet(newWb, wb3.Sheets[wb3.SheetNames[0]], "打款进度");

        // 提示缺失信息
        if (missingList.length > 0) {
            let showMsg = "处理完成，但发现以下单元格数据匹配空缺：\n" + missingList.slice(0, 8).join("\n");
            if (missingList.length > 8) showMsg += `\n...等共 ${missingList.length} 处`;
            errorMsg.innerText = showMsg;
            errorMsg.style.display = 'block';
        }

        // 动态计算文件名：IAA项目 - Applovin Max收入数据 - X月份.xlsx
        let d = new Date();
        d.setMonth(d.getMonth() - 1);
        let monthStr = (d.getMonth() + 1) + "月份";
        let outName = `IAA项目 - Applovin Max收入数据 - ${monthStr}.xlsx`;

        // 导出文件
        XLSX.writeFile(newWb, outName);
    };
</script>
</body>
</html>
