<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA Project Data Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #7000ff;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: rgba(0, 242, 254, 0.2);
            --border-hover: rgba(0, 242, 254, 0.8);
            --success: #00ffe0;
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 动态科技背景与网格 */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotate(-12deg) translateY(-20%);
            z-index: 0;
            pointer-events: none;
        }

        .glow-orb-1, .glow-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }

        .glow-orb-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
        .glow-orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -150px; right: -150px; }

        /* 主卡片（玻璃拟态） */
        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 40px;
            width: 520px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.1);
            text-align: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .brand-sub {
            color: var(--text-sub);
            font-size: 13px;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }

        /* 拖拽区域 */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .drop-zone:hover, .drop-zone.over {
            border-color: var(--border-hover);
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2) inset;
        }

        .icon-box {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: rgba(0, 242, 254, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .icon-box svg {
            width: 28px;
            height: 28px;
            fill: var(--primary);
        }

        .drop-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .drop-hint {
            font-size: 12px;
            color: var(--text-sub);
        }

        .drop-hint code {
            color: var(--primary);
            background: rgba(0, 242, 254, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* 文件解析列表 */
        .file-list {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-main);
        }

        .status-ok {
            color: var(--success);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        /* 按钮风格 */
        .btn {
            width: 100%;
            margin-top: 28px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
            display: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.6);
        }

        /* 报错弹窗结构 */
        #error-msg {
            margin-top: 16px;
            color: var(--danger);
            font-size: 12px;
            text-align: left;
            white-space: pre-wrap;
            display: none;
            background: rgba(255, 71, 87, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(ff, 71, 87, 0.3);
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="glow-orb-1"></div>
<div class="glow-orb-2"></div>

<div class="container">
    <div class="brand-title">IAA AUTOMATION</div>
    <div class="brand-sub">Applovin Max 收入数据智能整合引擎</div>
    
    <div class="drop-zone" id="dropZone">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
            </svg>
        </div>
        <div class="drop-title">拖入或点击上传源文件</div>
        <div class="drop-hint">必须包含 <code>max.csv</code> <code>tgaado.csv</code> <code>find.xlsx</code></div>
        <input type="file" id="fileInput" multiple accept=".csv, .xlsx" style="display: none;">
    </div>

    <div class="file-list" id="fileList"></div>
    <div id="error-msg"></div>
    
    <button class="btn" id="processBtn">EXECUTE COMBINE & DOWNLOAD</button>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const processBtn = document.getElementById('processBtn');
    const errorMsg = document.getElementById('error-msg');
    let filesMap = {};

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('over');
    dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('over'); handleFiles(e.dataTransfer.files); };

    function handleFiles(files) {
        for (let file of files) {
            let name = file.name.toLowerCase();
            if (name.includes('max')) filesMap['max'] = file;
            else if (name.includes('tgaado')) filesMap['tgaado'] = file;
            else if (name.includes('find')) filesMap['find'] = file;
        }
        renderFileList();
    }

    function renderFileList() {
        let html = '';
        const targets = [{key:'max', label:'max.csv'}, {key:'tgaado', label:'tgaado.csv'}, {key:'find', label:'find.xlsx'}];
        let readyCount = 0;
        
        targets.forEach(t => {
            if (filesMap[t.key]) {
                html += `<div class="file-item"><span>${t.label}</span><span class="status-ok">✔ READY</span></div>`;
                readyCount++;
            }
        });
        fileList.innerHTML = html;
        if (readyCount === 3) processBtn.style.display = 'block';
    }

    processBtn.onclick = async () => {
        errorMsg.style.display = 'none';
        errorMsg.innerText = '';

        const readAsArrayBuffer = file => new Promise(res => {
            const r = new FileReader();
            r.onload = e => res(e.target.result);
            r.readAsArrayBuffer(file);
        });

        const wb1 = XLSX.read(await readAsArrayBuffer(filesMap['max']), {type: 'array'});
        const wb2 = XLSX.read(await readAsArrayBuffer(filesMap['tgaado']), {type: 'array'});
        const wb3 = XLSX.read(await readAsArrayBuffer(filesMap['find']), {type: 'array'});

        let data1 = XLSX.utils.sheet_to_json(wb1.Sheets[wb1.SheetNames[0]], {header: 1});
        let data2 = XLSX.utils.sheet_to_json(wb2.Sheets[wb2.SheetNames[0]], {header: 1});
        let data3 = XLSX.utils.sheet_to_json(wb3.Sheets[wb3.SheetNames[0]], {header: 1});

        let mapE1 = {}, mapG1 = {}, mapH1 = {};
        let mapE2 = {}, mapG2 = {}, mapH2 = {};

        data3.forEach(row => {
            if (!row) return;
            if (row[8]) mapE1[row[8]] = row[9];
            if (row[11]) { mapG1[row[11]] = row[12]; mapH1[row[11]] = row[13]; }

            if (row[0]) mapE2[row[0]] = row[1];
            if (row[3]) { mapG2[row[3]] = row[4]; mapH2[row[3]] = row[5]; }
        });

        let missingList = [];

        function processRows(rows, isSheet1, sheetName) {
            if (!rows || rows.length === 0) return rows;
            let header = rows[0];
            header.splice(4, 0, "游戏原名");
            header.splice(6, 0, "渠道", "收款账户");

            for (let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if (!r || r.length === 0) continue;
                
                let keyD = r[3];
                let valE = isSheet1 ? mapE1[keyD] : mapE2[keyD];

                let keyF = r[4];
                let valG = isSheet1 ? mapG1[keyF] : mapG2[keyF];
                let valH = isSheet1 ? mapH1[keyF] : mapH2[keyF];

                if (!valE) missingList.push(`【${sheetName}】第 ${i+1} 行 E列(游戏原名)`);
                if (!valG) missingList.push(`【${sheetName}】第 ${i+1} 行 G列(渠道)`);
                if (!valH) missingList.push(`【${sheetName}】第 ${i+1} 行 H列(收款账户)`);

                r.splice(4, 0, valE || "");
                r.splice(6, 0, valG || "", valH || "");
            }
            return rows;
        }

        let processedData1 = processRows(data1, true, "MAX-YOURMAX账号");
        let processedData2 = processRows(data2, false, "MAX-Togaado账号");

        const newWs1 = XLSX.utils.aoa_to_sheet(processedData1);
        const newWs2 = XLSX.utils.aoa_to_sheet(processedData2);

        ["E1", "G1", "H1"].forEach(cell => {
            if (newWs1[cell]) newWs1[cell].s = { fill: { fgColor: { rgb: "FFFF00" } } };
            if (newWs2[cell]) newWs2[cell].s = { fill: { fgColor: { rgb: "FFFF00" } } };
        });

        const newWb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWb, newWs1, "MAX-YOURMAX账号");
        XLSX.utils.book_append_sheet(newWb, newWs2, "MAX-Togaado账号");
        XLSX.utils.book_append_sheet(newWb, wb3.Sheets[wb3.SheetNames[0]], "打款进度");

        if (missingList.length > 0) {
            let showMsg = "匹配完成，发现以下数据空缺：\n" + missingList.slice(0, 8).join("\n");
            if (missingList.length > 8) showMsg += `\n...等共 ${missingList.length} 处`;
            errorMsg.innerText = showMsg;
            errorMsg.style.display = 'block';
        }

        let d = new Date();
        d.setMonth(d.getMonth() - 1);
        let monthStr = (d.getMonth() + 1) + "月份";
        let outName = `IAA项目 - Applovin Max收入数据 - ${monthStr}.xlsx`;

        XLSX.writeFile(newWb, outName);
    };
</script>
</body>
</html>
