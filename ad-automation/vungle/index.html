<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liftoff Monetize 广告位自动化生成</title>
    <script type="module" src="../form.js"></script>
    <script src="../../theme.js?v=review1"></script>
    <link rel="stylesheet" href="../../console.css?v=review1">
    <link rel="stylesheet" href="../form.css">
</head>
<body class='console'>
<nav class='dock' aria-label='主导航'><a class='brand' href='../../' title='返回主页'>yyk <span>Console</span></a><div class='dock-links'><a href='../../reconciliation/'>收入对账</a><a aria-current="location" href='../../ad-automation/'>广告建位</a><a href="../../aab/">AAB 预检</a></div></nav>

<main class="panel ad-panel">
    <h1>Liftoff Monetize 广告位自动化生成</h1>
    <p class="ad-links"><a href="../setup/?provider=liftoff">打开 Liftoff 新版建位接口</a></p>
    <form id="adForm" data-provider="vungle">
        <div class="form-group">
            <label for="appName">应用名称（App Name）</label>
            <input type="text" id="appName" name="app_name" placeholder="例如 PiggySort" required>
        </div>
        <div class="form-group">
            <label for="downloadUrl">应用商店链接（Download URL）</label>
            <input type="url" id="downloadUrl" name="download_url" placeholder="https://apps.apple.com/…" required>
        </div>
        <div class="form-group">
            <label for="platform">目标平台（Platform）</label>
            <select id="platform" name="platform">
                <option value="ios">iOS</option>
                <option value="android">Android</option>
            </select>
        </div>
        <button type="submit" id="submitBtn">自动生成 Liftoff App 及 Placement</button>
    </form>
    <div id="result-box" aria-live="polite" hidden></div>
</main>

</body>
</html>
