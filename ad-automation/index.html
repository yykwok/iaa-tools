<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pangle 广告位一键生成</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 36px; width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; text-align: center; }
        .form-group { margin-bottom: 14px; text-align: left; }
        label { font-size: 13px; color: #333; font-weight: 600; display: block; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; outline: none; }
        .btn { background: #0066cc; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: 500; }
        .btn:hover { background: #0052a3; }
        #result-box { margin-top: 20px; display: none; padding: 16px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e5e5ea; font-size: 13px; word-break: break-all; }
        .slot-item { background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Pangle 广告位批量生成</h2>
    <form id="adForm" onsubmit="return false;">
        <div class="form-group">
            <label>Pangle User ID (主账号 ID)</label>
            <input type="number" id="userId" value="5032451" required>
        </div>
        <div class="form-group">
            <label>应用名称 (App Name)</label>
            <input type="text" id="appName" placeholder="例如: W999" required>
        </div>
        <div class="form-group">
            <label>应用商店链接 (Download URL)</label>
            <input type="text" id="downloadUrl" placeholder="https://apps.apple.com/us/app/..." required>
        </div>
        <div class="form-group">
            <label>目标平台 (Platform)</label>
            <select id="platform">
                <option value="android">Android</option>
                <option value="ios">iOS</option>
            </select>
        </div>
        <button type="button" class="btn" id="submitBtn">一键生成 App 及 3大广告位</button>
    </form>
    <div id="result-box"></div>
</div>

<script>
    document.getElementById('submitBtn').onclick = async function() {
        const userId = document.getElementById('userId').value.trim();
        const appName = document.getElementById('appName').value.trim();
        const downloadUrl = document.getElementById('downloadUrl').value.trim();
        const platform = document.getElementById('platform').value;

        if (!userId || !appName || !downloadUrl) {
            alert("请完整填写所有必填字段！");
            return;
        }

        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        resultBox.innerHTML = `⏳ 正在请求 Pangle 批量创建 App 及 Reward/Inter/Banner 广告位...`;

        try {
            const response = await fetch('https://api.hiyyk.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: parseInt(userId),
                    app_name: appName,
                    download_url: downloadUrl,
                    platform: platform
                })
            });

            const res = await response.json();
            if (res.code === 200) {
                resultBox.innerHTML = `
                    <b style="color: #28a745;">✔ Pangle 应用与广告位全部创建成功！</b><br><br>
                    • 应用名称：<b>${res.data.app_name}</b><br>
                    • 真实 App ID：<code>${res.data.pangle_app_id}</code><br><br>
                    <b>广告位列表：</b>
                    <div class="slot-item">🎬 <b>激励视频 (${res.data.slots.reward.name})</b><br>Slot ID: <code>${res.data.slots.reward.id}</code></div>
                    <div class="slot-item">📺 <b>插屏广告 (${res.data.slots.inter.name})</b><br>Slot ID: <code>${res.data.slots.inter.id}</code></div>
                    <div class="slot-item">🏷️ <b>Banner 广告 (${res.data.slots.banner.name})</b><br>Slot ID: <code>${res.data.slots.banner.id}</code></div>
                `;
            } else {
                resultBox.innerHTML = `<b style="color: #dc3545;">❌ Pangle 官方报错：</b> [Code ${res.code}] ${res.message}`;
            }
        } catch (e) {
            resultBox.innerHTML = `<b style="color: #dc3545;">❌ 网络或解析异常：</b> ${e.message}`;
        }
    };
</script>

</body>
</html>
