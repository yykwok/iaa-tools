<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广告位自动化生成工具</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --border: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 14px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
            font-size: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e1;
        }

        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .pangle .card-icon { background: #e0f2fe; color: #0284c7; }
        .vungle .card-icon { background: #f3e8ff; color: #7e22ce; }
        .unity .card-icon { background: #f1f5f9; color: #0f172a; }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>广告平台自动化建位</h1>
    <p class="subtitle">请选择需要自动生成 App 及广告位的平台</p>

    <div class="grid">
        <a href="./pangle/index.html" class="card pangle">
            <div class="card-icon">P</div>
            <div class="card-title">Pangle</div>
            <div class="card-desc">自动创建 Pangle App 及代码位</div>
        </a>

        <a href="./vungle/index.html" class="card vungle">
            <div class="card-icon">V</div>
            <div class="card-title">Vungle</div>
            <div class="card-desc">自动创建 Liftoff App 及 Placement</div>
        </a>

        <a href="./unity/index.html" class="card unity">
            <div class="card-icon">U</div>
            <div class="card-title">Unity Ads</div>
            <div class="card-desc">自动创建 Unity Project 及 Ad Units</div>
        </a>
    </div>
</div>

</body>
</html>
